<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>yellowkitchen</title>

  <link rel="stylesheet" href="./css/yellowkitchen.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@200;300;400;600;700;800;900&family=Poppins:wght@200;300;400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="contanier">

      <div class="header-inner">

        <a href="#" class="header-logo">
          <img
            src="./images/Logo.svg"
            alt="Yellow Kitchen"
            width="184"
            height="24">
        </a>

        <div class="header-actions">

          <button class="header-btn-person" aria-label="Log in">
            <img
              src="./images/log-in.png"
              alt="Log in"
              width="77"
              height="24">
          </button>

          <button class="header-btn-cart" aria-label="Shopping cart">
            <img
              src="./images/cart.png"
              alt="Shopping cart"
              width="36"
              height="24">
          </button>

          <button class="header-btn-button" aria-label="Open menu">
            <img
              src="./images/ic-menu-navigation.png"
              alt="Menu"
              width="24"
              height="24">
          </button>

        </div>

      </div>
    </div>
  </header>
  <!-- HEADER END -->


  <!-- HERO -->
  <section class="hero">

    <div class="contanier">

      <div class="hero-inner">

        <!-- LEFT: TITLE AND BUTTONS -->
        <div class="hero-box">

          <h1 class="hero-title">
            Your Food court at home
          </h1>

          <div class="hero-buttons">

            <button class="Delivery">
              <span class="button-title">Delivery</span>
              <span>Order in</span>
            </button>

            <button class="Takeout">
              <span class="button-title">Takeout</span>
              <span>Grab and go</span>
            </button>

          </div>

        </div>
        <!-- LEFT END -->


        <!-- RIGHT: IMAGES -->
        <div class="hero-img">

          <img
            src="./images/rucola-png.png"
            class="rucola"
            alt=""
            width="122"
            height="166">

          <img
            src="./images/Photo-plate.png"
            class="plate"
            alt="Fresh salad"
            width="648"
            height="649">

          <img
            src="./images/Photo-description.png"
            class="descp"
            alt="Fresh salad, il Pasifigio"
            width="181"
            height="104">

        </div>
        <!-- IMAGES END -->

      </div>


      <!-- INFORMATION BAR -->
      <aside class="information-bar">

        <div class="box-del">
          <img src="./images/time-eat.svg" alt="">

          <p>
            delivery in all paris in less than 30 minutes
          </p>
        </div>

        <div class="box-del">
          <img src="./images/delivery.svg" alt="">

          <p>
            Free delivery from 29 euros
          </p>
        </div>

        <div class="box-del">
          <img src="./images/paris.svg" alt="">

          <p>
            Only fresh and French products
          </p>
        </div>

      </aside>
      <!-- INFORMATION BAR END -->

    </div>

  </section>
  <!-- HERO END -->

</body>

</html>
